
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  GCC:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build infrastructure
        run: sudo apt-get install -y build-essential cmake ninja-build gcc-13 g++-13 libstdc++-13-dev

      - name: Build test
        run: |
          mkdir -p build/test 
          cd build/test
          cmake -GNinja -DQRCODE_TESTS_ENABLED:BOOL=True ../../
          ninja

      - name: Run test
        run: build/test/test/libqrcode_test

      - name: Build demo
        run: | 
          mkdir -p build/demo
          cd build/demo 
          cmake -GNinja -DLIBQRCODE_INCLUDE_DIR=$GITHUB_WORKSPACE/include/ ../../demo 
          ninja

      - name: Run demo
        run: |
          $GITHUB_WORKSPACE/build/demo/demo "Hello World!" >> result.svg
          diff -u --ignore-space-change --strip-trailing-cr --ignore-blank-lines demo/qrcode.svg result.svg

  Clang:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build infrastructure
        run: sudo apt-get install -y build-essential cmake ninja-build clang-15 libstdc++-13-dev

      - name: Build test
        run: |
          mkdir -p build/test 
          cd build/test
          cmake -GNinja -DQRCODE_TESTS_ENABLED:BOOL=True ../../
          ninja

      - name: Run test
        run: build/test/test/libqrcode_test

      - name: Build demo
        run: | 
          mkdir -p build/demo
          cd build/demo 
          cmake -GNinja -DLIBQRCODE_INCLUDE_DIR=$GITHUB_WORKSPACE/include/ ../../demo 
          ninja

      - name: Run demo
        run: |
          $GITHUB_WORKSPACE/build/demo/demo "Hello World!" >> result.svg
          diff -u --ignore-space-change --strip-trailing-cr --ignore-blank-lines demo/qrcode.svg result.svg

  AppleClang:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #- name: Install build infrastructure
      #  run: sudo apt-get install -y build-essential cmake ninja-build clang-15 libstdc++-13-dev

      - name: Build test
        run: |
          mkdir -p build/test 
          cd build/test
          cmake -GXcode -DQRCODE_TESTS_ENABLED:BOOL=True ../../
          xcodebuild -scheme ALL_BUILD build

      - name: Run test
        run: build/test/test/libqrcode_test

      - name: Build demo
        run: | 
          mkdir -p build/demo
          cd build/demo 
          cmake -GXcode -DLIBQRCODE_INCLUDE_DIR=$GITHUB_WORKSPACE/include/ ../../demo 
          xcodebuild -scheme ALL_BUILD build

      - name: Run demo
        run: |
          $GITHUB_WORKSPACE/build/demo/demo "Hello World!" >> result.svg
          diff -u --ignore-space-change --strip-trailing-cr --ignore-blank-lines demo/qrcode.svg result.svg

